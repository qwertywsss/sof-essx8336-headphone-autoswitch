# Enable automatic profile switching (Speaker <-> Headphones) on jack plug/unplug
# for the internal sof-essx8336 (ES8336) audio card, whose Headphones and
# Speaker outputs are separate ALSA/ACP profiles instead of ports of one
# profile, so they don't auto-switch by default in WirePlumber.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*sof-essx8336.*" }
    ]
    actions = {
      update-props = {
        api.acp.auto-profile = true
        api.acp.auto-port    = true
      }
    }
  }
]
